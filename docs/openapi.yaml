              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [admin]
      operationId: adminDeleteGroup
      summary: 删除组别
      description: |
        硬删除组别配置，仅用于清理联调/压测夹具，操作写入审计日志。
        只要该组别存在 enrollment_locks、enrollments 或 orders 记录就返回 409 GROUP_IN_USE：
        硬删除报名历史会破坏可追溯性与对账口径，此类组别应保留或按业务流程归档。
        MySQL 删除成功后同步删除 Redis group:{group_id}:remaining。
      security:
        - BearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
