  /payments/notify:
    post:
      tags: [payments]
      operationId: handlePaymentNotify
      summary: 微信支付回调
      description: |
        微信支付 V3 回调。处理顺序不可协商：
        1) 验签：先验签，失败返回 401（PAY_SIGN_INVALID），不修改任何数据；
        2) 锁行：事务内先执行 SELECT ... FOR UPDATE 锁定 Order 行；
        3) 状态：仅当 order.status='pending_payment' 时才迁移至 paid；
        4) 幂等：重复回调（order.status 已非 pending_payment）直接 COMMIT 返回 200，不执行 UPDATE；
        5) 金额：回调金额与 order.amount 不一致时不迁移，记录 PAY_AMOUNT_MISMATCH 告警，仍返回 200；
        6) 事务：Order→paid 与 Enrollment→paid 必须在同一数据库事务内；
        7) Redis：支付回调不执行 INCR/DECR（名额已在锁定阶段占用）。
      security: []
      parameters:
        - name: Wechatpay-Timestamp
          in: header
          required: true
          description: 微信支付回调时间戳，参与验签
          schema:
            type: string
        - name: Wechatpay-Nonce
          in: header
          required: true
          description: 微信支付回调随机串，参与验签
          schema:
            type: string
        - name: Wechatpay-Signature
          in: header
          required: true
          description: 微信支付回调签名
          schema:
            type: string
        - name: Wechatpay-Serial
          in: header
          required: true
          description: 微信支付平台证书序列号
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatPayNotifyRequest'
      responses:
        '200':
          description: 接收成功（微信要求 200）；重复回调、金额不一致也返回 200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 回调验签失败（PAY_SIGN_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

