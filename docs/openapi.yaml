                - name
                - price
                - total_slots
                - start_time
                - form_schema
                - disclaimer_version
              properties:
                event_id:
                  type: string
                name:
                  type: string
                price:
                  type: integer
                  minimum: 0
                total_slots:
                  type: integer
                  minimum: 1
                start_time:
                  type: string
                  format: date-time
                form_schema:
                  type: object
