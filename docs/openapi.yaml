        新剩余 = 原剩余 + (新 total_slots - 原 total_slots)；若新剩余 < 0，拒绝操作并返回 GROUP_SOLD_OUT。
      security:
        - BearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: integer
                  minimum: 0
                total_slots:
                  type: integer
                  minimum: 1
                start_time:
                  type: string
                  format: date-time
                form_schema:
                  type: object
                disclaimer_version:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 组别不存在（GROUP_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 名额调整导致剩余为负（GROUP_SOLD_OUT）
