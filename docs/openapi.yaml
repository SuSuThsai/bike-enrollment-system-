      summary: 创建组别
      description: |
        先写 MySQL；MySQL 插入成功后，必须在 Redis 初始化 group:{group_id}:remaining = total_slots。
        若 Redis 初始化失败，必须回滚 MySQL 插入，或将组别标记为不可用并禁止其对外展示/报名。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
