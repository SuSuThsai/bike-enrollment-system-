  /admin/stats/overview:
    get:
      tags: [admin]
      operationId: adminGetStatsOverview
      summary: 赛事统计总览
      description: |
        统计口径与 docs/state-machine.md 第六节对账等式对齐：
        total_slots 为 MySQL 配置值；remaining_slots 实时取自 Redis group:{group_id}:remaining，禁止从 MySQL 实时 COUNT。
        active_lock_count = enrollment_locks.status='active'；
        pending_payment_count = enrollments.status='pending_payment'（已消费锁，仍占用名额）；
        paid_count = enrollments.status IN ('paid','confirmed')。
        完整对账等式：remaining_slots + active_lock_count + pending_payment_count + paid_count = total_slots。
      security:
        - BearerAuth: []
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 赛事不存在（EVENT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/events/{event_id}/release-health:
    get:
      tags: [admin]
      operationId: adminGetReleaseHealth
      summary: 释放健康检查（锁泄漏 / 支付超时遗漏）
      description: |
        只读诊断，不修改任何数据：
        - 锁泄漏：enrollment_locks.status='active' 且 expires_at 已过期超过 1 分钟；
        - 支付超时遗漏：orders.status='pending_payment' 且 created_at 超过 15 分钟未释放。
        每个组别最多返回 5 条样例，便于定位具体 token / 订单。
      security:
        - BearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseHealth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 赛事不存在（EVENT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/events/{event_id}/registration/close:
    patch:
      tags: [admin]
      operationId: adminCloseEventRegistration
      summary: 手动关闭报名
      description: |
        置 registration_manually_closed=true，记录 reason 与操作日志。
        幂等：已关闭时重复调用返回 200 与当前状态；仅更新报名开关字段，
        不修改任何 enrollment / order / lock 状态。
      security:
        - BearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
                  description: 关闭原因；为空时默认“手动关闭”
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrationState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 赛事不存在（EVENT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{event_id}/registration/open:
    patch:
      tags: [admin]
      operationId: adminOpenEventRegistration
      summary: 重新开放报名
      description: |
        置 registration_manually_closed=false 并清空关闭原因，重新计算 registration_status。
        若截止时间已过（deadline 非空且 now > deadline），返回 409 REGISTRATION_DEADLINE_PASSED，
        且不修改数据库。
        幂等：已开放时重复调用返回 200 与当前状态；不修改任何 enrollment / order / lock 状态。
      security:
        - BearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrationState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 赛事不存在（EVENT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 报名截止时间已过（REGISTRATION_DEADLINE_PASSED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'