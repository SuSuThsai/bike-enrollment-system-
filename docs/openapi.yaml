              schema:
                $ref: '#/components/schemas/DeleteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 组别不存在（GROUP_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 组别仍存在锁、报名或订单（GROUP_IN_USE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/groups/{group_id}/rebuild-remaining:
    post:
      tags: [admin]
      operationId: adminRebuildGroupRemaining
      summary: 重建组别名额计数器
      description: |
        修复 Redis 中 group:{group_id}:remaining 缺失的组别（现象：赛事详情 500、报名被判 GROUP_SOLD_OUT）。
        remaining 按 docs/state-machine.md 第八节对账等式反推：
        remaining_slots = total_slots - active_lock_count - pending_payment_count - paid_count。
        默认只在 key 缺失时写入；key 已存在且与等式结果不一致时返回 409 GROUP_COUNTER_EXISTS，
        需显式传 force=true 才覆盖——覆盖前必须停止该组别的报名流量，否则可能与在途锁定竞争。
        反推结果为负说明数据本身已不满足等式，返回 409 GROUP_RECONCILE_FAILED，不修改 Redis。
        操作写入审计日志（谁、何时、重建了哪个组别、旧值、新值、四项计数）。
      security:
        - BearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          required: false
          description: 是否允许覆盖已存在且取值不一致的计数 key，默认 false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 重建结果（mode=created / overwritten / unchanged）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRemainingRebuild'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 组别不存在（GROUP_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            计数 key 已存在且与对账等式不一致（GROUP_COUNTER_EXISTS），
            或反推剩余为负（GROUP_RECONCILE_FAILED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

